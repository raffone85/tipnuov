<!DOCTYPE html>

<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ScoutAI Pro — Football Analytics Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg-0:#0a0c10;
  --bg-1:#10141b;
  --bg-2:#161b24;
  --bg-3:#1d2330;
  --line:rgba(255,255,255,0.06);
  --line-strong:rgba(255,255,255,0.12);
  --text-0:#f4f1ea;
  --text-1:#c9c6bf;
  --text-2:#7a7872;
  --text-3:#4a4a48;
  --amber:#ffb547;
  --amber-soft:rgba(255,181,71,0.12);
  --green:#3fd778;
  --green-soft:rgba(63,215,120,0.12);
  --red:#ff5f5f;
  --red-soft:rgba(255,95,95,0.10);
  --blue:#6dafff;
  --blue-soft:rgba(109,175,255,0.12);
  --gold:#d4a73c;
  --shadow-1:0 1px 2px rgba(0,0,0,0.4),0 4px 12px rgba(0,0,0,0.3);
  --shadow-2:0 8px 32px rgba(0,0,0,0.5);
  --r-sm:6px;
  --r-md:10px;
  --r-lg:14px;
  --display:'Archivo Narrow',sans-serif;
  --serif:'Fraunces',serif;
  --mono:'JetBrains Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  background:var(--bg-0);
  color:var(--text-0);
  font-family:var(--mono);
  font-size:13px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(circle at 18% 12%,rgba(255,181,71,0.045) 0%,transparent 40%),
    radial-gradient(circle at 82% 88%,rgba(63,215,120,0.035) 0%,transparent 45%);
}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.15)}

/* ============ APP SHELL ============ */
.app{
display:grid;
grid-template-columns:340px 1fr 360px;
grid-template-rows:64px 1fr;
grid-template-areas:
“header header header”
“sidebar main slip”;
height:100vh;
width:100vw;
}
@media (max-width:1280px){.app{grid-template-columns:300px 1fr 320px}}
@media (max-width:1024px){
.app{grid-template-columns:1fr;grid-template-areas:“header” “main”;}
.sidebar,.slip-panel{display:none}
.sidebar.mobile-open,.slip-panel.mobile-open{display:flex;position:fixed;top:64px;bottom:0;width:90%;z-index:50}
.sidebar.mobile-open{left:0}
.slip-panel.mobile-open{right:0}
}

/* ============ HEADER ============ */
.header{
grid-area:header;
background:var(–bg-1);
border-bottom:1px solid var(–line);
display:flex;
align-items:center;
padding:0 24px;
gap:24px;
position:relative;
z-index:10;
}
.brand{display:flex;align-items:baseline;gap:10px}
.brand-mark{
font-family:var(–display);
font-weight:700;
font-size:24px;
letter-spacing:-0.02em;
color:var(–text-0);
text-transform:uppercase;
}
.brand-mark .accent{color:var(–amber);font-style:italic;font-family:var(–serif);font-weight:500}
.brand-tag{
font-family:var(–mono);
font-size:9px;
text-transform:uppercase;
letter-spacing:0.18em;
color:var(–text-2);
padding:3px 8px;
border:1px solid var(–line-strong);
border-radius:3px;
}
.header-stats{
display:flex;
gap:18px;
margin-left:auto;
align-items:center;
}
.h-stat{display:flex;flex-direction:column;text-align:right;line-height:1.1}
.h-stat-label{font-size:9px;text-transform:uppercase;letter-spacing:0.15em;color:var(–text-2)}
.h-stat-value{font-family:var(–display);font-size:18px;font-weight:600;color:var(–text-0);margin-top:2px}
.h-stat-value.green{color:var(–green)}
.h-stat-value.amber{color:var(–amber)}
.h-divider{width:1px;height:30px;background:var(–line)}

.btn{
font-family:var(–mono);
font-size:11px;
font-weight:500;
letter-spacing:0.05em;
padding:8px 14px;
background:var(–bg-2);
color:var(–text-0);
border:1px solid var(–line-strong);
border-radius:var(–r-sm);
cursor:pointer;
transition:all 0.15s;
display:inline-flex;
align-items:center;
gap:6px;
}
.btn:hover{background:var(–bg-3);border-color:rgba(255,255,255,0.2)}
.btn.primary{background:var(–amber);color:#000;border-color:var(–amber);font-weight:600}
.btn.primary:hover{background:#ffc26b}
.btn.danger{color:var(–red);border-color:rgba(255,95,95,0.3)}
.btn.danger:hover{background:var(–red-soft)}
.btn.green{background:var(–green);color:#000;border-color:var(–green);font-weight:600}
.btn.green:hover{background:#5be38e}
.btn.sm{padding:5px 10px;font-size:10px}
.btn.icon{padding:6px;width:30px;height:30px;justify-content:center}

/* ============ SIDEBAR (Uploads) ============ */
.sidebar{
grid-area:sidebar;
background:var(–bg-1);
border-right:1px solid var(–line);
display:flex;
flex-direction:column;
overflow:hidden;
}
.sb-head{
padding:18px 20px 10px;
display:flex;
align-items:baseline;
justify-content:space-between;
border-bottom:1px solid var(–line);
}
.sb-title{
font-family:var(–display);
font-size:14px;
font-weight:600;
text-transform:uppercase;
letter-spacing:0.08em;
}
.sb-counter{
font-family:var(–mono);
font-size:10px;
color:var(–text-2);
}
.sb-counter b{color:var(–amber);font-weight:600}
.sb-actions{
display:flex;
gap:6px;
padding:10px 20px;
border-bottom:1px solid var(–line);
}
.sb-list{
flex:1;
overflow-y:auto;
padding:10px 14px 14px;
display:flex;
flex-direction:column;
gap:6px;
}
.mod-card{
background:var(–bg-2);
border:1px solid var(–line);
border-radius:var(–r-sm);
padding:10px 12px;
display:flex;
align-items:center;
gap:10px;
position:relative;
transition:all 0.15s;
}
.mod-card:hover{border-color:var(–line-strong)}
.mod-card.loaded{border-color:rgba(63,215,120,0.25);background:linear-gradient(90deg,rgba(63,215,120,0.05),var(–bg-2))}
.mod-num{
font-family:var(–display);
font-size:11px;
font-weight:700;
color:var(–text-2);
letter-spacing:0.05em;
width:30px;
flex-shrink:0;
}
.mod-card.loaded .mod-num{color:var(–green)}
.mod-info{flex:1;min-width:0}
.mod-name{
font-family:var(–mono);
font-size:11px;
color:var(–text-0);
font-weight:500;
margin-bottom:2px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}
.mod-meta{
font-size:9px;
color:var(–text-2);
text-transform:uppercase;
letter-spacing:0.05em;
}
.mod-card.loaded .mod-meta{color:var(–green)}
.mod-upload-btn{
width:24px;
height:24px;
border-radius:var(–r-sm);
background:var(–bg-3);
border:1px solid var(–line-strong);
color:var(–text-1);
cursor:pointer;
font-size:11px;
display:flex;
align-items:center;
justify-content:center;
transition:all 0.15s;
}
.mod-upload-btn:hover{background:var(–amber);color:#000;border-color:var(–amber)}
.mod-card.loaded .mod-upload-btn{display:none}
.mod-trash{
width:24px;
height:24px;
border-radius:var(–r-sm);
background:transparent;
border:1px solid var(–line);
color:var(–text-2);
cursor:pointer;
font-size:11px;
display:none;
align-items:center;
justify-content:center;
transition:all 0.15s;
}
.mod-card.loaded .mod-trash{display:flex}
.mod-trash:hover{color:var(–red);border-color:rgba(255,95,95,0.4)}
.mod-card input[type=file]{display:none}

/* ============ MAIN ============ */
.main{
grid-area:main;
background:var(–bg-0);
overflow:hidden;
display:flex;
flex-direction:column;
}
.tabs{
display:flex;
border-bottom:1px solid var(–line);
background:var(–bg-1);
padding:0 20px;
gap:0;
overflow-x:auto;
}
.tab{
font-family:var(–mono);
font-size:11px;
text-transform:uppercase;
letter-spacing:0.08em;
padding:14px 16px;
color:var(–text-2);
cursor:pointer;
border-bottom:2px solid transparent;
transition:all 0.15s;
white-space:nowrap;
font-weight:500;
}
.tab:hover{color:var(–text-1)}
.tab.active{color:var(–amber);border-bottom-color:var(–amber)}
.tab-badge{
margin-left:6px;
background:var(–bg-3);
color:var(–text-2);
padding:1px 6px;
border-radius:8px;
font-size:9px;
font-weight:600;
}
.tab.active .tab-badge{background:var(–amber);color:#000}

.main-toolbar{
padding:12px 20px;
border-bottom:1px solid var(–line);
background:var(–bg-1);
display:flex;
gap:10px;
align-items:center;
flex-wrap:wrap;
}
.market-select{
background:var(–bg-2);
border:1px solid var(–line-strong);
color:var(–text-0);
padding:7px 12px;
border-radius:var(–r-sm);
font-family:var(–mono);
font-size:11px;
cursor:pointer;
min-width:200px;
}
.search-input{
background:var(–bg-2);
border:1px solid var(–line-strong);
color:var(–text-0);
padding:7px 12px;
border-radius:var(–r-sm);
font-family:var(–mono);
font-size:11px;
flex:1;
max-width:280px;
}
.search-input:focus,.market-select:focus{outline:none;border-color:var(–amber)}
.toolbar-info{
margin-left:auto;
font-size:10px;
text-transform:uppercase;
letter-spacing:0.08em;
color:var(–text-2);
}
.toolbar-info b{color:var(–amber)}

.main-content{
flex:1;
overflow-y:auto;
padding:20px;
}

/* ============ EMPTY STATE ============ */
.empty-state{
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
height:100%;
text-align:center;
padding:40px;
}
.empty-mark{
font-family:var(–display);
font-size:120px;
font-weight:700;
color:var(–bg-2);
letter-spacing:-0.05em;
line-height:1;
margin-bottom:20px;
}
.empty-mark .accent{color:var(–amber);font-style:italic;font-family:var(–serif)}
.empty-title{
font-family:var(–display);
font-size:28px;
font-weight:600;
margin-bottom:10px;
text-transform:uppercase;
letter-spacing:0.02em;
}
.empty-desc{
color:var(–text-2);
max-width:480px;
margin-bottom:24px;
line-height:1.7;
}
.empty-modules{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:8px;
margin-top:8px;
max-width:600px;
}
.empty-module-dot{
width:38px;
height:38px;
border-radius:var(–r-sm);
background:var(–bg-2);
border:1px solid var(–line);
display:flex;
align-items:center;
justify-content:center;
font-family:var(–display);
font-weight:700;
font-size:11px;
color:var(–text-3);
}
.empty-module-dot.on{background:var(–green-soft);border-color:rgba(63,215,120,0.3);color:var(–green)}

/* ============ MATCH CARD ============ */
.match-card{
background:var(–bg-1);
border:1px solid var(–line);
border-radius:var(–r-md);
padding:14px 16px;
margin-bottom:10px;
transition:all 0.15s;
position:relative;
overflow:hidden;
}
.match-card:hover{border-color:var(–line-strong);background:var(–bg-2)}
.match-card.toppick{border-color:rgba(255,181,71,0.4);background:linear-gradient(90deg,rgba(255,181,71,0.04),var(–bg-1))}
.match-card.toppick::before{
content:’’;
position:absolute;
left:0;top:0;bottom:0;
width:3px;
background:linear-gradient(180deg,var(–amber),var(–gold));
}
.mc-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.mc-time{
font-family:var(–display);
font-size:14px;
font-weight:700;
color:var(–amber);
letter-spacing:0.05em;
min-width:48px;
}
.mc-event{
font-family:var(–display);
font-size:17px;
font-weight:600;
color:var(–text-0);
flex:1;
text-transform:uppercase;
letter-spacing:0.01em;
}
.mc-league{
font-size:9px;
color:var(–text-2);
text-transform:uppercase;
letter-spacing:0.1em;
padding:3px 8px;
border:1px solid var(–line);
border-radius:3px;
}
.mc-toppick-tag{
font-family:var(–display);
font-size:10px;
font-weight:700;
color:#000;
background:var(–amber);
padding:3px 8px;
border-radius:3px;
letter-spacing:0.1em;
text-transform:uppercase;
}
.mc-modcount{font-size:9px;color:var(–text-2);text-transform:uppercase;letter-spacing:0.08em}
.mc-modcount b{color:var(–green);font-weight:600}

.mc-markets{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
gap:6px;
}
.market-pill{
background:var(–bg-2);
border:1px solid var(–line);
border-radius:var(–r-sm);
padding:8px 10px;
display:flex;
align-items:center;
justify-content:space-between;
gap:8px;
position:relative;
cursor:pointer;
transition:all 0.12s;
min-height:46px;
}
.market-pill:hover{background:var(–bg-3);border-color:var(–line-strong)}
.market-pill.selected{border-color:var(–amber);background:var(–amber-soft)}
.market-pill.toppick{border-color:rgba(255,181,71,0.35)}
.market-pill.nobet{opacity:0.4}
.mp-info{flex:1;min-width:0}
.mp-name{
font-size:10px;
color:var(–text-1);
text-transform:uppercase;
letter-spacing:0.04em;
font-weight:500;
margin-bottom:2px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}
.mp-quote{
font-family:var(–mono);
font-size:11px;
color:var(–amber);
font-weight:600;
}
.mp-quote.muted{color:var(–text-3)}
.mp-score{
font-family:var(–display);
font-size:18px;
font-weight:700;
letter-spacing:-0.02em;
text-align:right;
min-width:30px;
}
.mp-score.s-high{color:var(–green)}
.mp-score.s-mid{color:var(–amber)}
.mp-score.s-low{color:var(–text-2)}
.mp-score.s-no{color:var(–red);font-size:10px;letter-spacing:0.1em}
.mp-star{
position:absolute;
top:-6px;
right:-6px;
width:18px;
height:18px;
background:var(–amber);
color:#000;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:10px;
font-weight:700;
box-shadow:0 2px 6px rgba(255,181,71,0.4);
}

/* ============ TOOLTIP / DETAIL ============ */
.detail-modal{
position:fixed;
top:0;left:0;right:0;bottom:0;
background:rgba(0,0,0,0.7);
display:none;
align-items:center;
justify-content:center;
z-index:100;
padding:20px;
backdrop-filter:blur(4px);
}
.detail-modal.show{display:flex}
.detail-box{
background:var(–bg-1);
border:1px solid var(–line-strong);
border-radius:var(–r-lg);
padding:24px;
max-width:600px;
width:100%;
max-height:85vh;
overflow-y:auto;
box-shadow:var(–shadow-2);
}
.detail-head{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:20px;
padding-bottom:14px;
border-bottom:1px solid var(–line);
}
.detail-title{font-family:var(–display);font-size:18px;font-weight:700;text-transform:uppercase;letter-spacing:0.03em}
.detail-section{margin-bottom:18px}
.detail-section-title{
font-size:10px;
text-transform:uppercase;
letter-spacing:0.12em;
color:var(–text-2);
margin-bottom:8px;
font-weight:600;
}
.detail-row{
display:flex;
justify-content:space-between;
padding:6px 0;
border-bottom:1px dashed var(–line);
font-size:12px;
}
.detail-row:last-child{border-bottom:none}
.detail-row .label{color:var(–text-1)}
.detail-row .value{color:var(–text-0);font-family:var(–mono);font-weight:500}
.detail-row .value.green{color:var(–green)}
.detail-row .value.red{color:var(–red)}
.detail-row .value.amber{color:var(–amber)}

/* ============ SLIP PANEL ============ */
.slip-panel{
grid-area:slip;
background:var(–bg-1);
border-left:1px solid var(–line);
display:flex;
flex-direction:column;
overflow:hidden;
}
.slip-head{
padding:18px 20px 14px;
border-bottom:1px solid var(–line);
}
.slip-title{
font-family:var(–display);
font-size:16px;
font-weight:700;
text-transform:uppercase;
letter-spacing:0.05em;
margin-bottom:8px;
}
.slip-summary{
display:flex;
justify-content:space-between;
align-items:flex-end;
}
.slip-summary-label{font-size:9px;color:var(–text-2);text-transform:uppercase;letter-spacing:0.12em}
.slip-summary-quote{
font-family:var(–display);
font-size:32px;
font-weight:700;
color:var(–amber);
letter-spacing:-0.02em;
line-height:1;
}
.slip-empty{
padding:30px 20px;
text-align:center;
color:var(–text-2);
font-size:11px;
}
.slip-list{
flex:1;
overflow-y:auto;
padding:10px 14px;
}
.slip-row{
background:var(–bg-2);
border:1px solid var(–line);
border-radius:var(–r-sm);
padding:10px 12px;
margin-bottom:6px;
position:relative;
}
.slip-row-head{
display:flex;
align-items:baseline;
justify-content:space-between;
margin-bottom:4px;
gap:8px;
}
.slip-event{
font-family:var(–display);
font-size:12px;
font-weight:600;
text-transform:uppercase;
letter-spacing:0.02em;
flex:1;
min-width:0;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}
.slip-time{font-size:9px;color:var(–text-2);font-family:var(–mono)}
.slip-market-row{
display:flex;
justify-content:space-between;
font-size:10px;
color:var(–text-1);
}
.slip-market-row .quote{color:var(–amber);font-weight:600;font-family:var(–mono)}
.slip-row-remove{
position:absolute;
top:6px;right:6px;
width:18px;height:18px;
background:transparent;
border:1px solid var(–line);
border-radius:3px;
color:var(–text-2);
cursor:pointer;
font-size:10px;
display:flex;
align-items:center;
justify-content:center;
}
.slip-row-remove:hover{color:var(–red);border-color:rgba(255,95,95,0.3)}
.slip-foot{
padding:14px 20px;
border-top:1px solid var(–line);
display:flex;
flex-direction:column;
gap:8px;
}

/* ============ AUTOBET ============ */
.autobet-config{
background:var(–bg-1);
border:1px solid var(–line);
border-radius:var(–r-md);
padding:14px 16px;
margin-bottom:10px;
}
.ab-head{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:10px;
}
.ab-title{
font-family:var(–display);
font-size:15px;
font-weight:700;
text-transform:uppercase;
letter-spacing:0.05em;
}
.ab-quote{
font-family:var(–display);
font-size:22px;
font-weight:700;
color:var(–amber);
}
.ab-quote.range-ok{color:var(–green)}
.ab-quote.range-no{color:var(–amber)}
.ab-meta{
font-size:10px;
color:var(–text-2);
text-transform:uppercase;
letter-spacing:0.08em;
margin-bottom:8px;
}
.ab-events{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.ab-event{
background:var(–bg-2);
border:1px solid var(–line);
border-radius:var(–r-sm);
padding:8px 10px;
display:flex;
align-items:center;
justify-content:space-between;
font-size:11px;
}
.ab-event-info{flex:1;min-width:0}
.ab-event-name{font-family:var(–display);font-weight:600;color:var(–text-0);text-transform:uppercase;letter-spacing:0.02em;font-size:12px}
.ab-event-market{font-size:10px;color:var(–text-1);margin-top:1px}
.ab-event-quote{
font-family:var(–mono);
font-size:12px;
font-weight:600;
color:var(–amber);
}
.ab-bar{
height:4px;
background:var(–bg-3);

<script>
// ═══════════════════════════════════════════════════════════════
// SCOUTAI PRO — CORE ENGINE
// Implementa il manuale tecnico ScoutAI Pro v6 (sigillato)
// ═══════════════════════════════════════════════════════════════

// ============ MODULES METADATA ============
const MODULES = [
  { id:1,  name:'Over 0.5 Primo Tempo',       short:'Ov 0.5 PT' },
  { id:2,  name:'GG / Over 2.5 (IGB)',        short:'IGB' },
  { id:3,  name:'Multigol 1-3 (ICH/ICA)',     short:'MG 1-3' },
  { id:4,  name:'IA Stats',                   short:'IA' },
  { id:5,  name:'Ammonizioni Giocatori',      short:'Ammoniti' },
  { id:6,  name:'Tiratori / Marcatori',       short:'Tiratori' },
  { id:7,  name:'Quote di Valore (Spread)',   short:'Value' },
  { id:8,  name:'GZ Index (Goal Zone)',       short:'GZ' },
  { id:9,  name:'DataMining Plus',            short:'DM+' },
  { id:10, name:'Differenziali Gol',          short:'Diff Gol' },
  { id:11, name:'Quote Cartellini',           short:'Cart' },
  { id:12, name:'Tiri / Tiri in Porta',       short:'Tiri' },
  { id:13, name:'Quote Corner',               short:'Corner' },
  { id:14, name:'Differenziali Corner',       short:'Diff Corn' },
];

// ============ STATE ============
const S = {
  raw: {},        // {modId: rows[]}
  matches: [],    // merged matches
  ammoniti: [],
  tiratori: [],
  slip: [],
  filterTab: 'matches',
};

// ============ STORAGE ============
const Store = {
  saveRaw(modId, rows) {
    try { localStorage.setItem(`scoutai_mod_${modId}`, JSON.stringify(rows)); }
    catch(e) { console.warn('LocalStorage full or blocked', e); }
  },
  loadRaw(modId) {
    try {
      const raw = localStorage.getItem(`scoutai_mod_${modId}`);
      return raw ? JSON.parse(raw) : null;
    } catch(e) { return null; }
  },
  removeRaw(modId) {
    try { localStorage.removeItem(`scoutai_mod_${modId}`); } catch(e) {}
  },
  saveSlip(slip) {
    try { localStorage.setItem('scoutai_slip', JSON.stringify(slip)); } catch(e) {}
  },
  loadSlip() {
    try {
      const raw = localStorage.getItem('scoutai_slip');
      return raw ? JSON.parse(raw) : [];
    } catch(e) { return []; }
  },
  clearAll() {
    try {
      for (let i=1; i<=14; i++) localStorage.removeItem(`scoutai_mod_${i}`);
      localStorage.removeItem('scoutai_slip');
    } catch(e) {}
  }
};

// ============ HELPERS ============
const num = (v) => {
  if (v === undefined || v === null || v === '') return null;
  if (typeof v === 'number') return isNaN(v) ? null : v;
  let s = String(v).trim();
  if (!s || s === '-' || s === '—') return null;
  // remove % sign
  s = s.replace('%', '');
  // detect EU format with thousands dots e.g. "1.234,56"
  const hasComma = s.includes(',');
  const hasDot = s.includes('.');
  if (hasComma && hasDot) {
    // assume dots = thousands, comma = decimal
    s = s.replace(/\./g, '').replace(',', '.');
  } else if (hasComma) {
    s = s.replace(',', '.');
  } else if (hasDot && (s.match(/\./g) || []).length > 1) {
    // multiple dots → likely thousands separators
    s = s.replace(/\./g, '');
  }
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
};
const pct = (v) => { const n = num(v); return n === null ? null : (n > 1.5 ? n : n * 100); };
const safeStr = (v) => (v === undefined || v === null) ? '' : String(v).trim();

// Levenshtein similarity (normalized)
function levSim(a, b) {
  if (!a || !b) return 0;
  if (a === b) return 1;
  const m = a.length, n = b.length;
  if (m === 0 || n === 0) return 0;
  const dp = Array(n+1).fill(0);
  for (let j=0; j<=n; j++) dp[j] = j;
  for (let i=1; i<=m; i++) {
    let prev = dp[0];
    dp[0] = i;
    for (let j=1; j<=n; j++) {
      const tmp = dp[j];
      dp[j] = (a[i-1] === b[j-1]) ? prev : 1 + Math.min(prev, dp[j], dp[j-1]);
      prev = tmp;
    }
  }
  return 1 - (dp[n] / Math.max(m, n));
}

// Normalize event name
const STOPWORDS = ['fc','ac','ssd','calcio','united','city','real','atletico','sporting','cf','sc','as','ssc','us','ud','cd','sv','if','bk','fk','aik','de','la','el','los','las','san'];
function normalizeEvent(name) {
  if (!name) return '';
  let s = String(name).toLowerCase();
  // unify separators
  s = s.replace(/[-–—_]/g, ' vs ');
  // remove diacritics
  s = s.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  // remove non-alphanumeric
  s = s.replace(/[^\w\s]/g, ' ');
  // remove stopwords
  const tokens = s.split(/\s+/).filter(t => t && !STOPWORDS.includes(t));
  return tokens.join(' ').trim();
}

// Normalize team list (split "home vs away")
function splitTeams(name) {
  const norm = normalizeEvent(name);
  // "vs" or " - "
  const parts = norm.split(/\s+vs\s+/);
  if (parts.length === 2) return parts;
  return [norm, ''];
}

const HHMM = (v) => {
  if (!v) return '';
  const s = String(v).trim();
  // patterns: HH:MM, HH.MM, ISO datetime
  let m = s.match(/(\d{1,2})[:.](\d{2})/);
  if (m) return m[1].padStart(2,'0') + ':' + m[2];
  // try Date
  const d = new Date(s);
  if (!isNaN(d)) return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  return '';
};

// ============ FILE PARSING ============
const Parser = {
  async parseFile(file) {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type:'array', cellDates:true });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    // get raw rows preserving duplicates: use header:1 then map
    const aoa = XLSX.utils.sheet_to_json(sheet, { header:1, defval:'', raw:false });
    if (!aoa.length) return [];
    // Some files have a title row; detect header by finding row with most non-empty short cells & known keywords
    let headerIdx = 0;
    for (let i=0; i<Math.min(3, aoa.length); i++) {
      const row = aoa[i].map(c => String(c).toLowerCase());
      const hits = row.filter(c => /ora|evento|naz|lega|match|data|igb|delta|mge|gz|spread|qovc|qunc|np|min|player|nome|squadra|partita/.test(c)).length;
      if (hits >= 2) { headerIdx = i; break; }
    }
    const headerRow = aoa[headerIdx].map(c => String(c).trim());
    // de-duplicate headers: append _2, _3...
    const seen = {};
    const headers = headerRow.map(h => {
      if (!h) return '__empty__' + Math.random().toString(36).slice(2,6);
      if (seen[h] === undefined) { seen[h] = 1; return h; }
      seen[h]++;
      return h + '_' + seen[h];
    });
    const rows = [];
    for (let i=headerIdx+1; i<aoa.length; i++) {
      const row = aoa[i];
      if (!row || row.every(c => c === '' || c === null)) continue;
      const obj = {};
      headers.forEach((h, j) => obj[h] = row[j]);
      rows.push(obj);
    }
    return rows;
  },

  // Smart column finder: returns first matching value
  pick(row, ...candidates) {
    if (!row) return undefined;
    const keys = Object.keys(row);
    for (const cand of candidates) {
      const lower = cand.toLowerCase();
      for (const k of keys) {
        if (k.toLowerCase() === lower) return row[k];
      }
      for (const k of keys) {
        if (k.toLowerCase().replace(/[^a-z0-9]/g,'') === lower.replace(/[^a-z0-9]/g,'')) return row[k];
      }
    }
    return undefined;
  },
  pickIndex(row, name, idx) {
    // pick the Nth occurrence (idx 0-based) — uses _2, _3 suffixes from de-dup
    if (!row) return undefined;
    const lower = name.toLowerCase();
    const keys = Object.keys(row);
    let count = 0;
    for (const k of keys) {
      const base = k.split('_')[0].toLowerCase();
      if (base === lower) {
        if (count === idx) return row[k];
        count++;
      }
    }
    return undefined;
  }
};

// ============ MERGE ENGINE ============
const Merge = {
  fingerprint(time, evt) {
    const norm = normalizeEvent(evt);
    return time ? (time + '|' + norm) : norm;
  },
  buildKey(row, modId) {
    let evt, time;
    if (modId === 1) { evt = Parser.pick(row,'EVENTO','Evento','EVENTI'); time = HHMM(Parser.pick(row,'ORA','Ora')); }
    else if (modId === 2) { evt = Parser.pick(row,'EVENTO','Evento'); time = HHMM(Parser.pick(row,'ORA','Ora','DATA EV.')); }
    else if (modId === 3) { evt = Parser.pick(row,'EVENTO','Evento'); time = HHMM(Parser.pick(row,'ORA','Ora')); }
    else if (modId === 4) { evt = Parser.pick(row,'EVENTO','Evento'); time = HHMM(Parser.pick(row,'DATA EV.','DATA','Ora','ORA')); }
    else if (modId === 7) { evt = Parser.pick(row,'Match','MATCH','EVENTO','Evento'); time = HHMM(Parser.pick(row,'Ora','ORA')); }
    else if (modId === 8) { evt = Parser.pick(row,'EVENTO','Evento'); time = HHMM(Parser.pick(row,'DATA EV.','DATA','Ora','ORA')); }
    else if (modId === 9) { evt = Parser.pick(row,'Match','MATCH','EVENTO','Evento'); time = HHMM(Parser.pick(row,'Ora','ORA')); }
    else if (modId === 10){ evt = Parser.pick(row,'EVENTO','Evento'); time = HHMM(Parser.pick(row,'ORA','Ora')); }
    else if (modId === 11){ evt = Parser.pick(row,'EVENTO','Evento'); time = HHMM(Parser.pick(row,'ORA','Ora','DATA EV.')); }
    else if (modId === 12){ evt = Parser.pick(row,'EVENTO','Evento'); time = HHMM(Parser.pick(row,'ORA','Ora','DATA EV.')); }
    else if (modId === 13){ evt = Parser.pick(row,'EVENTO','Evento'); time = HHMM(Parser.pick(row,'DATA EV.','DATA','ORA','Ora')); }
    else if (modId === 14){ evt = Parser.pick(row,'EVENTO','Evento'); time = HHMM(Parser.pick(row,'ORA','Ora')); }
    else { evt = Parser.pick(row,'EVENTO','Evento','Match'); time = HHMM(Parser.pick(row,'ORA','Ora')); }
    return { evt, time, key: this.fingerprint(time, evt) };
  },

  // Priority order from manual: 1 > 2 > 8 > 7 > 10 > 3 > 9 > 4 > 5 > 6 > 11 > 12 > 13 > 14
  buildMatches(raw) {
    const order = [1, 2, 8, 7, 10, 3, 9, 4, 11, 12, 13, 14];
    const matches = [];
    const byNorm = new Map(); // normalized event -> match[]

    const upsert = (key, time, evt, league) => {
      const norm = normalizeEvent(evt);
      // 1) exact key match
      let m = matches.find(x => x._key === key);
      if (m) return m;
      // 2) event-only match across same time bucket
      const candidates = byNorm.get(norm) || [];
      for (const c of candidates) {
        if (!time || !c.time || time === c.time || Math.abs(parseInt(time)-parseInt(c.time)) <= 0) return c;
      }
      // 3) fuzzy
      let best = null, bestSim = 0;
      for (const c of matches) {
        const sim = levSim(norm, c._norm);
        if (sim > bestSim) { bestSim = sim; best = c; }
      }
      if (best && bestSim >= 0.68) return best;
      // 4) new
      m = { _key:key, _norm:norm, time, event:evt || '', league:league || '', mods:{} };
      matches.push(m);
      const arr = byNorm.get(norm) || [];
      arr.push(m); byNorm.set(norm, arr);
      return m;
    };

    for (const modId of order) {
      const rows = raw[modId];
      if (!rows) continue;
      for (const row of rows) {
        const { evt, time, key } = this.buildKey(row, modId);
        if (!evt) continue;
        const league = Parser.pick(row, 'LEGA','NAZIONE','Nazione','Lega') || '';
        const m = upsert(key, time, evt, league);
        if (!m.event && evt) m.event = evt;
        if (!m.time && time) m.time = time;
        if (!m.league && league) m.league = league;
        m.mods[modId] = row;
      }
    }
    return matches;
  }
};

// ============ EXTRACTORS (per module) ============
const Ext = {
  // MOD-01: Over 0.5 PT
  m01(row) {
    if (!row) return null;
    return {
      IND: num(Parser.pick(row,'IND','Ind')),
      Delta: num(Parser.pick(row,'Delta','DELTA')),

  m02(row) {

  m03(row) {

      ICH: num(Parser.pick(row,'ICH')),
      VarC: num(Parser.pick(row,'VarC')),
      VU5C: num(Parser.pick(row,'VU5C')),

      MGFC: num(Parser.pick(row,'MGFC')),
      MGSO: num(Parser.pick(row,'MGSO')),
      Q1: num(Parser.pick(row,'Q1')),
      QO25: num(Parser.pick(row,'QO25','QOv2.5','QOv25')),
      Q2: num(Parser.pick(row,'Q2')),
      ICA: num(Parser.pick(row,'ICA')),
      VarO: num(Parser.pick(row,'VarO')),
      VU5O: num(Parser.pick(row,'VU5O')),
      RitO: num(Parser.pick(row,'RitO')),
      MGFO: num(Parser.pick(row,'MGFO')),
      MGSC: num(Parser.pick(row,'MGSC')),
    };
  },
  // MOD-04: IA Stats
  m04(row) {
    if (!row) return null;
    return {
      TTaff: num(Parser.pick(row,'TTaff')),
      TIPaff: num(Parser.pick(row,'TIPaff')),
      CorAff: num(Parser.pick(row,'CorAff')),
      FalAff: num(Parser.pick(row,'FalAff')),
      FGaff: num(Parser.pick(row,'FGaff')),
    };
  },
  // MOD-07: Quote Valore (Spread)
  m07(row) {
    if (!row) return null;
    return {
      NP: num(Parser.pick(row,'NP')),

function parseMultiOdds(v) {
  if (v === undefined || v === null || v === '') return null;
  if (typeof v === 'number') return v;
  const s = String(v);

  const direct = num(s);
  if (direct !== null && direct >= 1 && direct <= 100) return direct;
  // pattern Over X.X-Y.YY or Under X.X-Y.YY
  const m = s.match(/[oO]ver\s*\d[\.,]?\d*\s*[-–]\s*(\d[\.,]?\d*)/);

  // --- 4.7 Over 1.5 ---
  ov15(m) {

    if (GZ !== null && GZ < -1200 && MGE !== null && MGE < 1.8) nobet = true;
    if (e9?.OV15?.perc !== null && e9?.OV15?.perc !== undefined) {

    let quota = e9?.OV15?.quota || 1.30;

  segno(m, which) {

    const S1 = e2?.S1, S2 = e2?.S2, IGBc = e2?.IGBc, IGBo = e2?.IGBo;

    if (which === '1') {

    } else if (which === 'X') {
      if (S1 !== null && S2 !== null) {

        else if (d < 120) { score += 10; sig.push(`|S1-S2|<120 (+10)`); }

      if (IGBc !== null && IGBo !== null && IGBc >= 100 && IGBc <= 160 && IGBo >= 100 && IGBo <= 160) { score += 10; sig.push(`IGB equilibrato (+10)`); }

    } else { // 2
      if (S1 !== null && S2 !== null) {
        const d = S2 - S1;

    if (which === '1') { dmPerc = e9?._1?.perc; dmQuota = e9?._1?.quota; }
    else if (which === 'X') { dmPerc = e9?.X?.perc; dmQuota = e9?.X?.quota; }
    else { dmPerc = e9?._2?.perc; dmQuota = e9?._2?.quota; }
    if (dmPerc !== null && dmPerc !== undefined) {
      const w = npWeight(e9?.NP);
      const eff = dmPerc * w;
      if (eff >= 55) { score += 15; sig.push(`DM%·w≥55 (+15)`); }
      else if (eff >= 45) { score += 8; sig.push(`DM%·w≥45 (+8)`); }

    let quota = dmQuota || e10?.Qr || (which === '1' ? 2.20 : which === 'X' ? 3.30 : 3.10);

// ============ AGGREGATE PER MATCH ============
function computeMarkets(m) {
  const out = {};
  out.ov05pt    = Calc.ov05pt(m);
  out.gg        = Calc.gg(m);

  out.ov25      = Calc.ov25(m);

  out.mg13o     = Calc.mg13o(m);

  out.segx      = Calc.segno(m, 'X');
  out.seg2      = Calc.segno(m, '2');
  out.cardtot   = Calc.cardTot(m);
  out.cardc     = Calc.cardCasa(m);
  out.cardo     = Calc.cardOsp(m);

}

// ============ PLAYERS ============
const Players = {
  buildAmmoniti(rows) {
    const list = [];
    if (!rows) return list;
    for (const r of rows) {
      const Pres = num(Parser.pick(r,'Presenze'));
      const Min  = num(Parser.pick(r,'Minuti'));
      const Falli = num(Parser.pick(r,'Falli'));
      const Rit = num(Parser.pick(r,'Rit.','Rit'));
      const Amm = num(Parser.pick(r,'Ammonizioni'));
      const Tackle = num(Parser.pick(r,'Tackel','Tackle'));
      const Pos = safeStr(Parser.pick(r,'Pos.','Pos'));
      const probabile =
        (Pres !== null && Pres >= 5) &&
        (Min !== null && Min >= 60) &&
        (Falli !== null && Falli >= 1.8) &&
        (Rit !== null && Rit >= 2) &&
        (
          (Amm !== null && Amm >= 0.18) ||
          (Tackle !== null && Tackle >= 1.5) ||
          Pos === 'Difensore' || Pos === 'Centrocampista' ||
          (Pos === 'Attaccante' && Falli !== null && Falli >= 2.2)
        );
      if (probabile) {
        list.push({
          ora: Parser.pick(r,'Ora','ORA') || '',
          partita: Parser.pick(r,'Partita') || '',
          nome: Parser.pick(r,'Nome') || '',
          squadra: Parser.pick(r,'Squadra') || '',
          pos: Pos,
          presenze: Pres, minuti: Min, falli: Falli,
          rit: Rit, amm: Amm, tackle: Tackle,
          campionato: Parser.pick(r,'Campionato') || '',
        });
      }
    }
    return list.sort((a,b) => (b.rit||0) - (a.rit||0) || (b.falli||0) - (a.falli||0));
  },

      const possibile =

        (TT !== null && TT >= 2.0) &&
        (
          (Gol !== null && Gol >= 0.30) ||
          (TIP !== null && TIP >= 1.0) ||
          (Rit !== null && Rit >= 2 && TIP !== null && TIP >= 0.8 && (Pos === 'Attaccante' || Pos === 'Centrocampista'))
        );
      if (possibile) {
        list.push({
          ora: Parser.pick(r,'Ora','ORA') || '',
          partita: Parser.pick(r,'Partita') || '',
          nome: Parser.pick(r,'Nome') || '',
          squadra: Parser.pick(r,'Squadra') || '',
          pos: Pos,
          presenze: Pres, minuti: Min, tt: TT, tip: TIP, gol: Gol, rit: Rit,
          campionato: Parser.pick(r,'Campionato') || '',
        });
      }
    }
    return list.sort((a,b) => (b.rit||0) - (a.rit||0) || (b.tip||0) - (a.tip||0));
  },
};

// ============ AUTO-BET (SCHEDINE) ============
const AutoBet = {
  configs: [
    { id:'singola',   label:'Singola',  events:1,  qMin:1.65, qMax:1.80 },
    { id:'doppia',    label:'Doppia',   events:2,  qMin:1.81, qMax:2.50 },
    { id:'tris',      label:'Tris',     events:3,  qMin:2.51, qMax:3.00 },
    { id:'cinquina',  label:'Cinquina', events:5,  qMin:3.01, qMax:5.00 },
    { id:'decina',    label:'Decina',   events:10, qMin:5.01, qMax:999 },
  ],
  generate(matches, marketFilter) {
    // Build flat list of (match, marketKey, prediction) where score>=45 and not nobet and quota present
    const all = [];
    for (const m of matches) {
      const mk = m._markets || {};
      for (const key in mk) {
        const p = mk[key];
        if (!p || p.nobet) continue;
        if (p.score < 45) continue;
        if (!p.quota) continue;
        if (marketFilter && marketFilter !== 'all' && key !== marketFilter) continue;
        all.push({ match:m, key, pred:p });
      }
    }
    all.sort((a,b) => b.pred.score - a.pred.score);
    return this.configs.map(cfg => this.buildOne(cfg, all, matches));
  },
  buildOne(cfg, all, matches) {
    // Greedy: pick top N without same match repeated
    const used = new Set();
    const selected = [];
    let q = 1;
    for (const item of all) {
      if (selected.length >= cfg.events) break;
      const matchKey = item.match._key;
      if (used.has(matchKey)) continue;
      used.add(matchKey);
      selected.push(item);
      q *= item.pred.quota || 1;
    }
    // If quota < min, integrate with MG 1-3 (1.30) up to max 4 extras
    let added = 0;
    if (q < cfg.qMin && selected.length === cfg.events) {
      for (const m of matches) {
        if (added >= 4) break;
        if (used.has(m._key)) continue;
        const mk = m._markets || {};
        const candidates = [mk.mg13c, mk.mg13o].filter(p => p && !p.nobet && p.score >= 45 && p.quota);
        if (candidates.length === 0) continue;
        const best = candidates.sort((a,b)=>b.score-a.score)[0];
        const key = best === mk.mg13c ? 'mg13c' : 'mg13o';
        used.add(m._key);
        selected.push({ match:m, key, pred:best });
        q *= best.quota;
        added++;
        if (q >= cfg.qMin) break;
      }
    }
    // If quota > max and removable, drop and try lower
    while (q > cfg.qMax && selected.length > cfg.events) {
      const last = selected.pop();
      q /= (last.pred.quota || 1);
    }
    const avgScore = selected.length ? selected.reduce((a,b)=>a + b.pred.score, 0) / selected.length : 0;
    return { cfg, selected, totalQuote:q, avgScore, inRange:q >= cfg.qMin && q <= cfg.qMax };
  }
};

// ============ APP CONTROLLER ============
const App = {
  init() {
    this.renderSidebar();
    // Restore from localStorage
    let restoredMods = 0;
    for (let i=1; i<=14; i++) {
      const data = Store.loadRaw(i);
      if (data) { S.raw[i] = data; restoredMods++; }
    }
    S.slip = Store.loadSlip();
    this.renderSidebar();
    if (restoredMods > 0) {
      Toast.show(`Ripristinati ${restoredMods} moduli da memoria`, 'success');
      this.process();
    } else {
      UI.renderEmpty();
    }
    Slip.render();
  },
  renderSidebar() {
    const list = document.getElementById('sbList');
    list.innerHTML = '';
    let loaded = 0;
    MODULES.forEach(mod => {
      const isLoaded = !!S.raw[mod.id];
      if (isLoaded) loaded++;
      const card = document.createElement('div');
      card.className = 'mod-card' + (isLoaded ? ' loaded' : '');
      card.innerHTML = `
        <div class="mod-num">M${String(mod.id).padStart(2,'0')}</div>
        <div class="mod-info">
          <div class="mod-name">${mod.name}</div>
          <div class="mod-meta">${isLoaded ? `${(S.raw[mod.id]||[]).length} righe` : 'In attesa'}</div>
        </div>
        <input type="file" id="file_${mod.id}" accept=".xlsx,.xls,.csv" />
        <button class="mod-upload-btn" onclick="document.getElementById('file_${mod.id}').click()" title="Carica">↑</button>
        <button class="mod-trash" onclick="App.removeMod(${mod.id})" title="Rimuovi">×</button>
      `;
      list.appendChild(card);
      card.querySelector('input').addEventListener('change', (e) => this.handleFile(e, mod.id));
    });
    document.getElementById('sbCount').textContent = loaded;
    document.getElementById('hStatMods').textContent = `${loaded}/14`;
  },
  async handleFile(ev, modId) {
    const file = ev.target.files[0];
    if (!file) return;
    try {
      Toast.show(`Caricamento ${MODULES[modId-1].name}...`, '');
      const rows = await Parser.parseFile(file);
      S.raw[modId] = rows;
      Store.saveRaw(modId, rows);
      Toast.show(`✓ ${MODULES[modId-1].name}: ${rows.length} righe`, 'success');
      this.renderSidebar();
    } catch(err) {
      console.error(err);
      Toast.show(`Errore: ${err.message}`, 'error');
    }
    ev.target.value = '';
  },
  removeMod(modId) {
    delete S.raw[modId];
    Store.removeRaw(modId);
    this.renderSidebar();
    Toast.show(`${MODULES[modId-1].name} rimosso`, '');
  },
  clearAll() {
    if (!confirm('Cancellare TUTTI i file caricati?')) return;
    S.raw = {}; S.matches = []; S.ammoniti = []; S.tiratori = [];
    Store.clearAll();
    this.renderSidebar();
    UI.renderEmpty();
    UI.refreshHeader();
    Toast.show('Tutti i file cancellati', 'success');
  },
  exportConfig() {
    const cfg = {};
    for (const k in S.raw) cfg[k] = MODULES[k-1].name + ': ' + (S.raw[k]?.length || 0) + ' righe';
    alert('Moduli caricati:\n\n' + Object.entries(cfg).map(([k,v])=>`M${k.padStart(2,'0')}: ${v}`).join('\n'));
  },
  process() {
    if (Object.keys(S.raw).length === 0) {
      Toast.show('Carica almeno un file per processare', 'error');
      return;
    }
    const btn = document.getElementById('processBtn');
    btn.classList.add('processing');
    btn.textContent = 'Processing...';

    // Build matches via merge
    setTimeout(() => {
      try {
        S.matches = Merge.buildMatches(S.raw);
        // Compute markets for each
        for (const m of S.matches) m._markets = computeMarkets(m);
        // Players
        S.ammoniti = Players.buildAmmoniti(S.raw[5]);
        S.tiratori = Players.buildTiratori(S.raw[6]);

        UI.refreshHeader();
        UI.setTab(S.filterTab);
        Toast.show(`Processate ${S.matches.length} partite`, 'success');
      } catch(err) {
        console.error(err);
        Toast.show('Errore durante il processo: ' + err.message, 'error');
      }
      btn.classList.remove('processing');
      btn.innerHTML = '⚡ Processa';
    }, 50);
  }
};

  renderMatches() {
    const c = document.getElementById('mainContent');
    if (!S.matches.length) { this.renderEmpty(); return; }
    const filter = document.getElementById('marketFilter').value;
    const search = (document.getElementById('searchInput').value || '').toLowerCase();
    let arr = [...S.matches];
    // filter top picks tab
    if (S.filterTab === 'toppicks') {
      arr = arr.filter(m => {
        const mk = m._markets || {};
        if (filter !== 'all') return mk[filter] && mk[filter].top;
        return Object.values(mk).some(p => p.top);
      });
    }
    if (search) arr = arr.filter(m => (m.event || '').toLowerCase().includes(search));
    if (filter !== 'all') {
      arr.sort((a,b) => {
        const sa = a._markets?.[filter]?.score || 0;
        const sb = b._markets?.[filter]?.score || 0;
        return sb - sa;
      });
    } else {
      arr.sort((a,b) => {
        const ma = Math.max(...Object.values(a._markets || {}).map(p => p.score || 0));
        const mb = Math.max(...Object.values(b._markets || {}).map(p => p.score || 0));
        return mb - ma;
      });
    }
    c.innerHTML = '';
    document.getElementById('toolbarCount').textContent = arr.length;
    if (!arr.length) {
      c.innerHTML = '<div class="empty-state"><div class="empty-title" style="font-size:18px;color:var(--text-2)">Nessun risultato per il filtro selezionato</div></div>';
      return;
    }
    const frag = document.createDocumentFragment();
    arr.slice(0, 200).forEach(m => frag.appendChild(this.buildMatchCard(m, filter)));
    c.appendChild(frag);
  },

      { k:'mg24',      show:'MG 2-4' },
      { k:'seg1',      show:'1' },
      { k:'segx',      show:'X' },
      { k:'seg2',      show:'2' },

      const tp = p.top ? ' toppick' : '';
      return `<div class="market-pill${sel}${nb}${tp}" onclick="UI.toggleSlipPick('${m._key}','${k}')" oncontextmenu="event.preventDefault();UI.openDetail('${m._key}','${k}');return false;">

      <div class="mc-markets">${html}</div>
    `;
    return card;
  },

    const p = m._markets[marketKey];

    const idx = S.slip.findIndex(s => s.matchKey === matchKey && s.marketKey === marketKey);

    else {
      S.slip.push({
        matchKey, marketKey,
        event: m.event, time: m.time,
        market: p.name, quota: p.quota || 0, score: p.score

    Store.saveSlip(S.slip);
    Slip.render();
    this.renderMatches();

        </div>
        <div class="player-stat"><div class="player-stat-val">${p.tt !== null ? p.tt.toFixed(2) : '—'}</div><div class="player-stat-lbl">Tiri</div></div>
        <div class="player-stat"><div class="player-stat-val">${p.tip !== null ? p.tip.toFixed(2) : '—'}</div><div class="player-stat-lbl">Porta</div></div>
        <div class="player-stat"><div class="player-stat-val">${p.gol !== null ? p.gol.toFixed(2) : '—'}</div><div class="player-stat-lbl">Gol</div></div>
        <div class="player-stat"><div class="player-stat-val">${p.minuti !== null ? p.minuti.toFixed(0) : '—'}</div><div class="player-stat-lbl">Min</div></div>
      `;
      c.appendChild(div);
    });
  },

  toggleSidebar() { document.getElementById('sidebar').classList.toggle('mobile-open'); },
  toggleSlip()    { document.getElementById('slipPanel').classList.toggle('mobile-open'); },
};

// ============ SLIP ============
const Slip = {
  render() {
    const list = document.getElementById('slipList');
    const quoteEl = document.getElementById('slipQuote');
    if (!S.slip.length) {
      list.innerHTML = '<div class="slip-empty">Lo slip è vuoto.<br>Clicca su un mercato in una scheda per aggiungerlo.</div>';
      quoteEl.textContent = '—';
      return;
    }
    let q = 1;
    list.innerHTML = '';
    S.slip.forEach((s, i) => {
      q *= s.quota || 1;
      const row = document.createElement('div');
      row.className = 'slip-row fade-in';
      row.innerHTML = `
        <div class="slip-row-head"><div class="slip-event">${s.event}</div><div class="slip-time">${s.time||''}</div></div>
        <div class="slip-market-row"><span>${s.market}</span><span class="quote">@${(s.quota||0).toFixed(2)}</span></div>
        <button class="slip-row-remove" onclick="Slip.remove(${i})">×</button>
      `;
      list.appendChild(row);
    });
    quoteEl.textContent = '@' + q.toFixed(2);
  },
  remove(i) {
    S.slip.splice(i, 1);
    Store.saveSlip(S.slip);
    this.render();
    UI.renderMatches();
  },
  clear() {
    if (!S.slip.length) return;
    if (!confirm('Svuotare lo slip?')) return;
    S.slip = [];
    Store.saveSlip(S.slip);
    this.render();
    UI.renderMatches();
  },
  copyTelegram() {
    if (!S.slip.length) { Toast.show('Slip vuoto', 'error'); return; }
    let q = 1;
    const date = new Date().toLocaleDateString('it-IT');
    let text = `🏆 ScoutAI Pro — Schedina ${date}\n\n`;
    S.slip.forEach(s => {
      q *= s.quota || 1;
      text += `⚽ ${s.event}${s.time?' ('+s.time+')':''}\n`;
      text += `   📊 ${s.market} @ ${(s.quota||0).toFixed(2)}\n`;
    });
    text += `\n──────────────────\n`;
    text += `🎯 Quota Totale: @${q.toFixed(2)}\n`;
    text += `📱 Generato con ScoutAI Pro`;
    navigator.clipboard.writeText(text).then(() => {
      Toast.show('Schedina copiata negli appunti ✓', 'success');
    }).catch(() => {
      // fallback
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); ta.remove();
      Toast.show('Schedina copiata negli appunti ✓', 'success');
    });
  }
};

// ============ TOAST ============
const Toast = {
  show(msg, type='') {
    const t = document.getElementById('toast');
    t.className = 'toast show ' + type;
    t.textContent = msg;
    clearTimeout(this._t);
    this._t = setTimeout(() => t.classList.remove('show'), 2800);
  }
};

// ============ INIT ============
document.addEventListener('DOMContentLoaded', () => App.init());
</script>
